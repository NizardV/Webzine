name: Webzine Prod Pipeline
on: [push]

jobs:
  pipeline-execution:
    runs-on: linux  # On garde le label qui marche !
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🏗️ Docker Build
        run: |
          # On précise où est le fichier avec -f
          docker build -t webzine-app:latest -f ./Webzine/Dockerfile .

      - name: 🛡️ Security Scan with Trivy
        run: |
          # 1. Installation de Trivy si absent
          if ! command -v trivy &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y wget apt-transport-https gnupg lsb-release
            wget -qO - https://aquasecurity.github.io/trivy-repo/dabest.gpg | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
            echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
            sudo apt-get update && sudo apt-get install -y trivy
          # 2. Scan de l'image (on ne bloque pas la pipeline même s'il y a des failles pour l'instant)
          trivy image --severity HIGH,CRITICAL webzine-app:latest

      - name: 🚀 Deployment
        run: |
          docker rm -f webzine-app || true
          docker run -d --name webzine-app --restart unless-stopped -p 8080:8080 webzine-app:latest