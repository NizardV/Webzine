name: Debug Pipeline
on: [push, pull_request] # Se déclenche sur ABSOLUMENT TOUT

jobs:
  pipeline-execution:
    runs-on: linux # On utilise le label qui n'a pas d'espace
    steps:
      - name: Test Step
        run: echo "Le runner a enfin reçu le signal !"

      # --- ÉTAPE 3 : AUDIT DE SÉCURITÉ (DevSecOps) ---
      - name: Security Scan with Trivy
        run: |
          # Vérifie si Trivy est là, sinon l'installe
          if ! command -v trivy &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y wget apt-transport-https gnupg lsb-release
            wget -qO - https://aquasecurity.github.io/trivy-repo/dabest.gpg | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
            echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
            sudo apt-get update && sudo apt-get install -y trivy
          fi
          # Scan de l'image et export du rapport en texte
          trivy image --severity HIGH,CRITICAL webzine-app:latest > trivy-report.txt
          echo "--- APERÇU DU RAPPORT DE SÉCURITÉ ---"
          head -n 20 trivy-report.txt

      # --- ÉTAPE 4 : DÉPLOIEMENT (CD) ---
      - name: Stop & Remove Old Instance
        run: |
          docker rm -f webzine-app || true

      - name: Launch New Production Container
        run: |
          docker run -d \
            --name webzine-app \
            --restart unless-stopped \
            -p 80:8080 \
            --security-opt "apparmor=docker-default" \
            webzine-app:latest

      # --- ÉTAPE 5 : NETTOYAGE ---
      - name: System Prune
        run: |
          docker image prune -f