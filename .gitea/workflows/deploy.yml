name: CI/CD Webzine DevSecOps

on: [push]

jobs:
  build-and-deploy:
    runs-on: linux
    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: 🏗️ Construction de l'image Docker
        run: |
          # 🥷 On cherche le fichier Program.cs et on injecte la ligne magique UsePathBase
          find . -name "Program.cs" -exec sed -i '/var app = builder.Build();/a \    app.UsePathBase("/web-dev");' {} +
          
          # Vérification visuelle dans les logs de la pipeline
          find . -name "Program.cs" -exec grep -H "UsePathBase" {} +

          docker build -t webzine-app:latest .          

      - name: 🛡️ Analyse de sécurité (Trivy)
        run: |
          if ! command -v trivy &> /dev/null; then
            echo "Installation de Trivy..."
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          fi
          trivy image --severity HIGH,CRITICAL webzine-app:latest                    

        run: |
          docker stop webzine-app || true
          docker rm webzine-app || true

          docker run -d \
            --name webzine-app \
            --restart always \
            -p 8080:8080 \
            -e ASPNETCORE_ENVIRONMENT=Production \
            -e AppConfig__Environment=Production \
            -e AppConfig__Repository=Database \
            -e AppConfig__Seeder=Deezer \
            -e AppConfig__DeezerApi='https://api.deezer.com' \
            # 🚀 UTILISE DES GUILLEMETS SIMPLES ICI :
            -e 'AppConfig__PostgresPassword=${{ secrets.POSTGRESQL }}' \
            webzine-app:latest