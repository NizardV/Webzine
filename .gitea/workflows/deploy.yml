name: CI/CD Webzine DevSecOps
on: [push]

jobs:
  build-and-deploy:
    runs-on: linux
    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: 🏗️ Construction de l'image Docker
        run: |
          # Cette ligne magique insère app.UsePathBase("/web-dev"); juste après la création de l'objet 'app'
          sed -i '/var app = builder.Build();/a \    app.UsePathBase("/web-dev");' Webzine.WebApplication/Program.cs
          
          docker build -t webzine-app:latest .   

      - name: 🛡️ Analyse de sécurité (Trivy)
        run: |
          if ! command -v trivy &> /dev/null; then
            echo "Installation propre de Trivy..."
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          fi
          trivy image --severity HIGH,CRITICAL webzine-app:latest          

      - name: 🚀 Déploiement du conteneur
        run: |
          # 1. On nettoie l'ancien conteneur s'il existe
          docker stop webzine-app || true
          docker rm webzine-app || true
          
          # 2. On lance le nouveau avec les variables de configuration
          # On utilise la double barre du bas (__) pour descendre dans l'arborescence du JSON AppConfig:Repository
          docker run -d \
            --name webzine-app \
            --restart always \
            -p 8080:8080 \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e AppConfig__Environment=Development \
            -e AppConfig__Repository=Local \
            -e AppConfig__Seeder=Factories \
            webzine-app:latest          